name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-quality:
    name: Unit and quality (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Reject embedded operational database credentials
        run: python scripts/check_no_embedded_operational_credentials.py
      - name: Install unit-test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Fatal lint checks
        run: python -m ruff check --select F taxi_duration_predictor tests/unit tests/conftest.py
      - name: Unit tests with coverage
        run: python -m pytest tests/unit --cov=taxi_duration_predictor.domain --cov=taxi_duration_predictor.config --cov-report=term-missing
      - name: Compile package
        run: python -m compileall -q taxi_duration_predictor

  package-api:
    name: Package and API contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install complete development environment
        run: python -m pip install -e ".[api,mlops,dev]"
      - name: Build wheel
        run: python -m pip wheel --no-deps --wheel-dir .ci-dist .
      - name: Raw-trip model lifecycle, attribution, failures and HTTP inference
        run: python -m pytest -q tests/api tests/integration

  dependency-audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install auditable runtime
        run: python -m pip install -e ".[api,mlops,dev,audit]"
      - name: Capture resolved third-party dependencies
        run: python -m pip freeze --exclude-editable > .audit-requirements.txt
      - name: Audit resolved dependencies
        run: python -m pip_audit --strict --requirement .audit-requirements.txt --progress-spinner off

  secret-scan:
    name: Current-tree secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Scan only the exact current tree with redacted findings
        shell: bash
        run: |
          scanner=$(mktemp -d)
          snapshot=$(mktemp -d)
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output /tmp/gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz' | sha256sum --check
          tar -xzf /tmp/gitleaks.tar.gz -C "${scanner}"
          git archive HEAD | tar -x -C "${snapshot}"
          "${scanner}/gitleaks" dir "${snapshot}" --redact --no-banner

  docker:
    name: Docker build and health smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate Compose configuration
        run: docker compose --env-file deployment/.env.docker.example -f deployment/docker-compose.yml config --quiet
      - name: Build application images
        run: |
          docker build --file deployment/Dockerfile.api --tag taxi-duration-api:ci .
          docker build --file deployment/Dockerfile.dashboard --tag taxi-duration-dashboard:ci .
      - name: Smoke-test container health endpoints
        shell: bash
        run: |
          set -euo pipefail

          cleanup() {
            docker rm -f taxi-duration-api-ci taxi-duration-dashboard-ci taxi-tracking-ci >/dev/null 2>&1 || true
            docker network rm taxi-lifecycle-ci >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run --name taxi-duration-api-ci --detach --publish 8000:8000 taxi-duration-api:ci
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/health >/dev/null; then
              break
            fi
            if [ "${attempt}" -eq 30 ]; then
              docker logs taxi-duration-api-ci
              exit 1
            fi
            sleep 2
          done

          # Real HTTP artifact service, a separate training process, then the API.
          # No shared model filesystem is mounted between these containers.
          docker network create taxi-lifecycle-ci
          docker run --name taxi-tracking-ci --detach --network taxi-lifecycle-ci \
            --publish 5000:5000 \
            --env MLFLOW_SERVER_ALLOWED_HOSTS=taxi-tracking-ci:5000,localhost:5000,127.0.0.1:5000 \
            taxi-duration-api:ci mlflow server --host 0.0.0.0 --port 5000 \
            --backend-store-uri sqlite:////app/data/tracking.db \
            --serve-artifacts --artifacts-destination /app/data/artifacts
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:5000/health >/dev/null; then break; fi
            if [ "${attempt}" -eq 60 ]; then docker logs taxi-tracking-ci; exit 1; fi
            sleep 2
          done
          docker run --rm --network taxi-lifecycle-ci \
            --env MLFLOW_TRACKING_URI=http://taxi-tracking-ci:5000 \
            taxi-duration-api:ci python -m taxi_duration_predictor.pipeline.train --bootstrap > .ci-training.json
          run_id=$(jq -er '.best_run_id' .ci-training.json)
          docker rm -f taxi-duration-api-ci
          docker run --name taxi-duration-api-ci --detach --network taxi-lifecycle-ci --publish 8000:8000 \
            --env MLFLOW_TRACKING_URI=http://taxi-tracking-ci:5000 \
            --env TAXI_MODEL_RUN_ID="${run_id}" taxi-duration-api:ci
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/health >/dev/null; then break; fi
            if [ "${attempt}" -eq 30 ]; then docker logs taxi-duration-api-ci; exit 1; fi
            sleep 2
          done
          curl --fail --silent --show-error http://127.0.0.1:8000/api/v1/predict/ \
            --header 'Content-Type: application/json' \
            --data '{"pickup_latitude":40.7,"pickup_longitude":-74.0,"dropoff_latitude":40.8,"dropoff_longitude":-73.9,"pickup_datetime":"2026-01-01T08:00:00-05:00"}' > .ci-prediction.json
          jq -e --arg run_id "${run_id}" '.run_id == $run_id and .model.run_id == $run_id and .model.provenance.data_kind == "synthetic" and .model.metrics_status == "MEASURED" and .confidence_score == null' .ci-prediction.json

          docker run \
            --name taxi-duration-dashboard-ci \
            --detach \
            --publish 8506:8506 \
            --env MLFLOW_TRACKING_URI=http://example.invalid:5000 \
            --env DATABASE_URL=postgresql://example.invalid/taxi \
            taxi-duration-dashboard:ci
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8506/_stcore/health >/dev/null; then
              break
            fi
            if [ "${attempt}" -eq 30 ]; then
              docker logs taxi-duration-dashboard-ci
              exit 1
            fi
            sleep 2
          done
